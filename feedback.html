<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - wood-warm-style</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo"><a href="index.html">wood-warm-style</a></h1>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="banner-ad ad-slot"
         data-ad-container="true"
         data-ad-id="banner"
         data-ad-position="banner"
         data-ad-networks="adsense,adsterra,admanager"
         data-ad-status="pending">
        <div class="ad-skeleton">
            <div class="ad-label">Advertisement</div>
        </div>
        <div class="ad-content" data-ad-network="adsense"></div>
        <div class="ad-content" data-ad-network="adsterra"></div>
        <div class="ad-content" data-ad-network="admanager"></div>
    </div>


    <main class="main">
        <div class="container">
            <div class="article-full">
                <h1 class="page-title">Feedback</h1>
                <p>We value your feedback! Please <a href="contact.html">contact us</a> to share your thoughts, suggestions, or concerns.</p>
            </div>
        </div>
    </main>

    

    <div class="ad-slot"
         data-ad-container="true"
         data-ad-id="bottom-banner"
         data-ad-position="bottom"
         data-ad-networks="adsense,adsterra,admanager"
         data-ad-status="pending"
         style="min-height: 90px; width: 100%;">
        <div class="ad-skeleton">
            <div class="ad-label">Advertisement</div>
        </div>
        <div class="ad-content" data-ad-network="adsense"></div>
        <div class="ad-content" data-ad-network="adsterra"></div>
        <div class="ad-content" data-ad-network="admanager"></div>
    </div>
<footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 wood-warm-style. All rights reserved.</p>
            </div>
        </div>
    </footer>


    <script src="js/ad-config.js" defer></script>
    <script src="js/ad-adapters.js" defer></script>
    <script src="js/ads.js" defer></script>
    <script src="js/ad-injector.js" defer></script>
</body>
</html>
